<a href="#contenido" class="saltar">Saltar al contenido</a>

<mat-sidenav-container class="contenedor">
  <mat-sidenav
    class="lateral"
    [mode]="movil() ? 'over' : 'side'"
    [opened]="!movil() || menuAbierto()"
    (closedStart)="menuAbierto.set(false)"
    [attr.aria-label]="'Menú'"
  >
    <app-marca-iglesia />
    <nav aria-label="Menú principal">
      <ul class="menu">
        @for (entrada of entradas(); track entrada.ruta) {
          <li>
            @if (entrada.pendiente) {
              <span
                class="enlace deshabilitado"
                matTooltip="Pendiente de migrar a Angular"
                aria-disabled="true"
              >
                <lucide-icon [img]="entrada.icono" [size]="20" aria-hidden="true" />
                {{ entrada.etiqueta }}
              </span>
            } @else {
              <a
                class="enlace"
                [routerLink]="entrada.ruta"
                routerLinkActive="activo"
                [routerLinkActiveOptions]="{ exact: entrada.ruta === '/' }"
                (click)="alNavegar()"
              >
                <lucide-icon [img]="entrada.icono" [size]="20" aria-hidden="true" />
                {{ entrada.etiqueta }}
              </a>
            }
          </li>
        }
      </ul>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content class="principal">
    <header class="barra">
      @if (movil()) {
        <button matIconButton type="button" aria-label="Abrir menú" (click)="menuAbierto.set(true)">
          <lucide-icon [img]="iconos.Menu" [size]="20" aria-hidden="true" />
        </button>
        <app-marca-iglesia />
      }
      <div class="derecha">
        <button matIconButton type="button" aria-label="Alternar tema" (click)="alternarTema()">
          <lucide-icon class="solo-claro" [img]="iconos.Sun" [size]="20" aria-hidden="true" />
          <lucide-icon class="solo-oscuro" [img]="iconos.Moon" [size]="20" aria-hidden="true" />
        </button>
        <button matButton type="button" class="cuenta" [matMenuTriggerFor]="menuCuenta">
          <lucide-icon [img]="iconos.UserRound" [size]="20" aria-hidden="true" />
          @if (usuario(); as u) {
            <span class="datos-cuenta">
              <span class="nombre">{{ u.nombre }}</span>
              <span class="rol">{{ etiquetasRol[u.rol] }}</span>
            </span>
          }
          <lucide-icon [img]="iconos.ChevronDown" [size]="16" aria-hidden="true" />
          <span class="sr-only">Menú de cuenta</span>
        </button>
        <mat-menu #menuCuenta="matMenu" xPosition="before">
          @if (usuario(); as u) {
            <div class="cabecera-menu">
              <span class="nombre">{{ u.nombre }}</span>
              <span class="texto-suave correo">{{ u.email }}</span>
            </div>
          }
          <mat-divider />
          <a mat-menu-item routerLink="/mi-cuenta">
            <lucide-icon [img]="iconos.UserRound" [size]="16" aria-hidden="true" /> Mi cuenta
          </a>
          <button mat-menu-item type="button" class="peligro" (click)="cerrarSesion()">
            <lucide-icon [img]="iconos.LogOut" [size]="16" aria-hidden="true" /> Cerrar sesión
          </button>
        </mat-menu>
      </div>
    </header>

    <main id="contenido" tabindex="-1" class="contenido">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
